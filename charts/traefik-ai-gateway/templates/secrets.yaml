{{- /*
Every generated secret is computed once here, because the same value lands in
several objects (the Open WebUI client secret is in the Keycloak realm and in
Open WebUI's environment). Redis and vLLM read redis-auth / vllm-api-key
through existingSecret in their blueprint values; Traefik reads them through
urn:k8s:secret references.
*/ -}}
{{- $redisPw := include "tag.secretValue" (list . "redis-auth" "password" .Values.secrets.redisPassword) -}}
{{- $vllmKey := include "tag.secretValue" (list . "vllm-api-key" "key" .Values.secrets.vllmApiKey) -}}
{{- $kcAdmin := include "tag.secretValue" (list . "keycloak-admin" "password" .Values.secrets.keycloakAdminPassword) -}}
{{- $owuiSecret := include "tag.secretValue" (list . "open-webui-oidc" "client-secret" .Values.secrets.openWebUIClientSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  labels:
    {{- include "tag.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $redisPw | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: vllm-api-key
  labels:
    {{- include "tag.labels" . | nindent 4 }}
type: Opaque
stringData:
  key: {{ $vllmKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  labels:
    {{- include "tag.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $kcAdmin | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: open-webui-oidc
  labels:
    {{- include "tag.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ $owuiSecret | quote }}
---
# Loaded by the open-webui component with extraEnvFrom, so the domain is set
# once (here) instead of in every component. The open-webui values leave
# openaiBaseApiUrl empty and sso disabled, so the chart sets none of these
# variables itself and these take effect.
apiVersion: v1
kind: Secret
metadata:
  name: open-webui-gateway-env
  labels:
    {{- include "tag.labels" . | nindent 4 }}
type: Opaque
stringData:
  WEBUI_URL: https://{{ include "tag.chatHost" . }}
  # Chat goes through the AI gateway. The key is only sent on /v1/models,
  # which the gateway answers from the static catalog; chats carry the user's
  # Keycloak token: the connection's Auth (OAuth) is seeded by the blueprint
  # into Open WebUI's config.json (open-webui copyAppData).
  ENABLE_OPENAI_API: "true"
  OPENAI_API_BASE_URL: https://{{ include "tag.aiHost" . }}/v1
  OPENAI_API_KEY: model-catalog-is-public
  ENABLE_OLLAMA_API: "false"
  # Keycloak SSO only. The first user to sign in becomes the Open WebUI admin.
  ENABLE_OAUTH_SIGNUP: "true"
  ENABLE_LOGIN_FORM: "false"
  OAUTH_CLIENT_ID: open-webui
  OAUTH_CLIENT_SECRET: {{ $owuiSecret | quote }}
  OPENID_PROVIDER_URL: {{ include "tag.kcIssuer" . }}/.well-known/openid-configuration
  OAUTH_PROVIDER_NAME: Keycloak
  OAUTH_SCOPES: openid email profile
  OAUTH_GROUP_CLAIM: groups
  # Required: adds X-OpenWebUI-User-* headers. The gateway's Open WebUI child
  # routes match on them (blocks answered as HTTP 200), and they show in the
  # Traefik access log.
  ENABLE_FORWARD_USER_INFO_HEADERS: "true"
  # Both MCP servers behind the MCP gateway, called with the user's own token.
  TOOL_SERVER_CONNECTIONS: {{ list
      (dict "type" "mcp" "url" (printf "https://%s/mcp/ai-factory" (include "tag.aiHost" .)) "auth_type" "system_oauth" "key" "" "headers" dict "config" (dict "enable" true) "info" (dict "id" "ai-factory-ops" "name" "AI Factory Ops (Traefik MCP gateway)" "description" "Model and GPU operations, governed per identity by Traefik"))
      (dict "type" "mcp" "url" (printf "https://%s/mcp/deepwiki" (include "tag.aiHost" .)) "auth_type" "system_oauth" "key" "" "headers" dict "config" (dict "enable" true) "info" (dict "id" "deepwiki" "name" "DeepWiki (Traefik MCP gateway)" "description" "Repository docs, scoped to the repos in your token"))
    | toJson | quote }}
---
# Keycloak realm, imported on start. Keycloak's directory import requires the
# file to be named <realm>-realm.json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    {{- include "tag.labels" . | nindent 4 }}
data:
  ai-factory-realm.json: |
    {{- include "tag.realm" (dict "ctx" . "clientSecret" $owuiSecret) | nindent 4 }}
