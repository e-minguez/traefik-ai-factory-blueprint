{{- $models := list .Values.backends.ollama.models.developer .Values.backends.ollama.models.admin .Values.vllmModel -}}
# Static model catalog at https://ai.<domain>/v1/models. Open WebUI lists
# models with its static key (never the user's token), and the gateway fronts
# two backends, so no single upstream can answer for the whole gateway. The
# list is not a secret: access is enforced on /v1/chat/completions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-catalog
  labels:
    {{- include "tag.labels" . | nindent 4 }}
data:
  main.py: |
    import json, os, time
    from http.server import BaseHTTPRequestHandler, HTTPServer

    MODELS = [m.strip() for m in os.environ["MODELS"].split(",") if m.strip()]
    BODY = json.dumps({
        "object": "list",
        "data": [{"id": m, "object": "model", "created": int(time.time()), "owned_by": "ai-factory"} for m in MODELS],
    }).encode()

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path.split("?", 1)[0].rstrip("/") in ("/v1/models", "/models", "/healthz"):
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(BODY)))
                self.end_headers()
                self.wfile.write(BODY)
            else:
                self.send_error(404)

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-catalog
  labels:
    app: model-catalog
    {{- include "tag.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-catalog
  template:
    metadata:
      labels:
        app: model-catalog
    spec:
      containers:
        - name: catalog
          image: {{ .Values.modelCatalog.image }}
          command: ["python3", "/app/main.py"]
          env:
            - name: MODELS
              value: {{ join "," $models | quote }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: code
              mountPath: /app
      volumes:
        - name: code
          configMap:
            name: model-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: model-catalog
  labels:
    {{- include "tag.labels" . | nindent 4 }}
spec:
  selector:
    app: model-catalog
  ports:
    - name: http
      port: 8080
      targetPort: 8080
