{{- /*
One certificate (secret demo-tls) for every demo host. All IngressRoutes in
this chart reference it with tls.secretName, so the cluster's default
certificate (and Rancher's own ingress) is left untouched.
*/ -}}
{{- $issuer := .Values.tls.issuer -}}
{{- if eq $issuer "letsencrypt" }}
# HTTP-01 cannot issue wildcards, so the four hosts are listed explicitly.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Release.Namespace }}-letsencrypt
  labels:
    {{- include "tag.labels" . | nindent 4 }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    {{- with .Values.tls.acmeEmail }}
    email: {{ . | quote }}
    {{- end }}
    privateKeySecretRef:
      name: {{ .Release.Namespace }}-letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
{{- else if eq $issuer "selfsigned" }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: demo-bootstrap
  labels:
    {{- include "tag.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-ca
  labels:
    {{- include "tag.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: traefik-ai-gateway-demo-ca
  secretName: demo-ca
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: demo-bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: demo-ca
  labels:
    {{- include "tag.labels" . | nindent 4 }}
spec:
  ca:
    secretName: demo-ca
{{- else }}
{{- fail "tls.issuer must be letsencrypt or selfsigned" }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-tls
  labels:
    {{- include "tag.labels" . | nindent 4 }}
spec:
  secretName: demo-tls
  dnsNames:
    - {{ include "tag.aiHost" . }}
    - {{ include "tag.chatHost" . }}
    - {{ include "tag.kcHost" . }}
    {{- if .Values.inspector.enabled }}
    - {{ include "tag.inspectorHost" . }}
    {{- end }}
  issuerRef:
    {{- if eq $issuer "letsencrypt" }}
    name: {{ .Release.Namespace }}-letsencrypt
    kind: ClusterIssuer
    {{- else }}
    name: demo-ca
    kind: Issuer
    {{- end }}
