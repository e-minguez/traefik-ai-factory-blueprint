# Values for the traefik-ai-gateway chart. In the blueprint, only the
# "Per install" block normally needs overriding in the install wizard.

# --- Per install --------------------------------------------------------------

# Base DNS name. Hosts: ai.<domain> (AI + MCP gateway), chat.<domain>
# (Open WebUI), keycloak.<domain>, inspector.<domain>.
# With sslip.io this is the load balancer IP, e.g. 203.0.113.10.sslip.io
domain: ""

tls:
  # "letsencrypt" (HTTP-01 through Traefik, needs port 80 from the internet) or
  # "selfsigned" (local CA; clients must trust the demo-ca secret's ca.crt).
  issuer: letsencrypt
  # Optional contact address for the Let's Encrypt account (ACME). Only used
  # for account recovery and notices about the account; certificates are
  # issued without it.
  acmeEmail: ""

# Must match vllm.servingEngineSpec.modelSpec[0].modelURL in the blueprint.
vllmModel: Qwen/Qwen2.5-1.5B-Instruct

# --- Backends (SUSE AI chart services in the same namespace) --------------------
# The blueprint pins every release name, so these defaults match it.
backends:
  ollama:
    service: ollama
    port: 11434
    # Small CPU chat models; admins get both, developers only the first.
    models:
      developer: qwen2.5:0.5b
      admin: smollm2:135m
    embeddingModel: nomic-embed-text
    guardModel: llama-guard3:1b
  vllm:
    service: vllm-router-service
    port: 80
  milvus:
    service: milvus
    port: 19530
  redis:
    service: redis
    port: 6379
  openWebUI:
    service: open-webui
    port: 80

# --- Gateway policy ------------------------------------------------------------
rateLimits:
  admins:
    group: {limit: 100000, period: 1h}
    user: {limit: 20000, period: 1h}
  developers:
    group: {limit: 5000, period: 10m}
    user: {limit: 1500, period: 10m}

semanticCache:
  collectionName: ai_factory_chat
  maxDistance: 0.1
  ttl: 300

llmGuard:
  # Request-side prompt screening with the guard model on Ollama. Turn off to
  # shave 1-3 s of CPU inference per prompt.
  enabled: true
  # Per guard call; CPU-only Ollama under load needs the headroom.
  timeoutSeconds: 60

# Data protection on every allowed chat route (content-guard, regex engine):
# e-mail addresses, card numbers, IBANs, international phone numbers and
# secrets (API keys, private keys) are masked with X before the prompt reaches
# any guard, model or the cache, and again in the answer.
piiGuard:
  enabled: true
  # Masking answers buffers the response, so streamed answers arrive in one
  # piece. Turn off if a client needs token-by-token streaming.
  maskResponses: true

# Jailbreak / prompt-injection detection.
jailbreak:
  # Deterministic patterns ("ignore all previous instructions", "reveal your
  # system prompt", ...) masked by content-guard, so the model never sees the
  # injection phrase. Fast and predictable.
  patterns: true
  # A second LLM guard, run in parallel with llama-guard3 (parallel-llm-guard,
  # total latency = the slower guard). A small model judges whether the prompt
  # is a jailbreak attempt. Small models misjudge, so by default the verdict is
  # only recorded in the traces ("trace"); "block" denies the request.
  judge:
    enabled: true
    model: qwen2.5:0.5b
    action: trace

# GPU resilience: requests for the vLLM model fail over to a CPU model on
# Ollama when vLLM answers 429 or 5xx (or has no ready pod). The answer's
# "model" field shows which one served it.
failover:
  enabled: true
  fallbackModel: qwen2.5:0.5b

# Detailed GenAI metrics (token usage, cost, time to first token) on the
# chat-completion middlewares, exported over OTLP. Needs Traefik Hub v3.21 or
# later; the blueprint pins Hub v3.20.13 (docs/known-issues.md): keep false.
aiMetrics:
  detailed: false

# Request rate limit per user on the MCP routes (distributedRateLimit, counters
# in the same Redis as the token budgets). Protects tools from runaway agents.
mcpRateLimit:
  enabled: true
  limit: 30
  period: 1m
  burst: 10

# Web application firewall (Coraza with the OWASP Core Rule Set) on the
# browser-facing hosts: chat, keycloak, inspector. Request bodies are not
# inspected, so prompts (which often contain code or SQL) cause no false
# positives; URLs, query strings and headers are.
waf:
  enabled: true

# Applied to the AI routes on Traefik Hub. The newer plugin key is
# "semantic-cache"; the deprecated key below was proven on Hub v3.20.6 (the
# v3.21 release notes do not list it as removed).
semanticCachePluginKey: chat-completion-semantic-cache

# --- Secrets -------------------------------------------------------------------
# Empty = generated on first install and kept across upgrades (helm lookup).
# Set them explicitly if your deploy path does not support lookup.
secrets:
  redisPassword: ""
  vllmApiKey: ""
  openWebUIClientSecret: ""
  keycloakAdminPassword: ""
  # Demo persona passwords (admin@ai-factory.demo / dev@ai-factory.demo).
  demoAdminPassword: admin1234
  demoDevPassword: dev1234

# --- Components ----------------------------------------------------------------
keycloak:
  image: quay.io/keycloak/keycloak:26.3
  # 3600 = one hour; Open WebUI refreshes its tokens server-side.
  accessTokenLifespan: 3600
  # Measured: ~1.4 GiB steady, ~2.4 GiB peak during the start-up build step
  # (start-dev re-augments Quarkus on every start). A 2Gi limit gets it
  # OOMKilled.
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 3Gi
  # Heap capped at half the limit, so the native memory of the start-up build
  # (metaspace, JIT code cache, direct buffers) fits in the other half; fewer
  # glibc malloc arenas on many-core nodes.
  env:
    - name: JAVA_OPTS_KC_HEAP
      value: "-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=50"
    - name: MALLOC_ARENA_MAX
      value: "2"

modelCatalog:
  image: registry.suse.com/bci/python:3.12

mcpServer:
  image: registry.suse.com/bci/python:3.12

inspector:
  enabled: true
  image: ghcr.io/modelcontextprotocol/inspector:0.21.1

deepwiki:
  enabled: true

# Injected by the SUSE AI Factory operator (vendor: suse); unused here because
# every image in this chart is public.
global:
  imagePullSecrets: []
